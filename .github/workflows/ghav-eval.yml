name: GHAV Telegraf 1328 complete Node checks

on:
  push:
    branches:
      - codex/ghav-telegraf1328-repair-*

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fixed Before source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ae76f125b3201ee9a8e1b97b59c3d39e72c878e5
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify fixed source and versions
        shell: bash
        run: |
          set -euo pipefail
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_LOCK_SHA=$(shasum -a 256 package-lock.json | cut -d' ' -f1)"
          echo "GHAV_NODE_VERSION=$(node --version)"
          echo "GHAV_NPM_VERSION=$(npm --version)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run complete test task
        run: npm test
      - name: Run complete lint task
        run: npm run lint
      - name: Fingerprint generated source outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "GHAV_BUILD_FILE_COUNT=$(find lib typings -type f | wc -l | tr -d ' ')"
          echo "GHAV_BUILD_SHA=$(find lib typings -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
